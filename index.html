<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F1209" media="(prefers-color-scheme: dark)">
  <meta name="description" content="What the Algerian dinar is really worth.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%239FE870'/><text x='50' y='66' font-size='52' font-weight='800' fill='%23163300' text-anchor='middle' font-family='system-ui'>DZ</text></svg>">
  <title>Real DZD</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>Real DZD</h1>
    <button id="status" type="button"><i></i><span>Loading rates</span></button>
  </header>

  <section class="conv" aria-label="Converter">
    <div class="field">
      <label for="from-amt">You send</label>
      <div class="row">
        <input id="from-amt" inputmode="decimal" autocomplete="off" value="100">
        <span class="sel"><select id="from" aria-label="Currency you send"></select></span>
      </div>
    </div>
    <button id="swap" type="button" aria-label="Swap currencies">
      <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V4M6 4L3 7M6 4l3 3M14 4v12M14 16l-3-3M14 16l3-3"/></svg>
    </button>
    <div class="field">
      <label for="to-amt">They get</label>
      <div class="row">
        <input id="to-amt" inputmode="decimal" autocomplete="off">
        <span class="sel"><select id="to" aria-label="Currency they get"></select></span>
      </div>
    </div>
  </section>

  <p id="rate" class="rate">&nbsp;</p>

  <section id="gap" class="gap" hidden>
    <div><span>Bank rate</span><b id="bank"></b></div>
    <div><span>Real rate</span><b id="real"></b></div>
    <p id="gap-note"></p>
  </section>

  <section id="chart" class="chart" aria-label="Rate history">
    <div class="ch-top">
      <div>
        <span id="cl" class="mute"></span>
        <strong id="cv"></strong>
        <span><b id="cp"></b> <span id="cd" class="mute"></span></span>
      </div>
      <div class="tabs" role="group" aria-label="Time range">
        <button data-r="30" type="button">1M</button>
        <button data-r="90" type="button" aria-pressed="true">3M</button>
        <button data-r="180" type="button">6M</button>
      </div>
    </div>
    <div id="plot"></div>
    <p class="none">History is available for pairs that include the dinar.</p>
  </section>

  <section class="ref">
    <h2>Quick amounts</h2>
    <ul id="ref"></ul>
  </section>

  <p class="note">
    Street rates for information only. Check with your exchanger before you trade.<br>
    Built by <a href="https://github.com/BAW2501/" target="_blank" rel="noopener">Belhadj Ahmed Walid</a>
  </p>
</main>
<script src="app.js"></script>
</body>
</html>
